name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate boilerplate zip
        run: |
          mkdir -p /tmp/release
          cp bootstrap.sh /tmp/release/
          cd /tmp/release
          echo "y" | bash bootstrap.sh my-project
          rm bootstrap.sh
          zip -r ../cc-boilerplate-${{ github.ref_name }}.zip . \
            --exclude "*.DS_Store"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            bootstrap.sh
            cc-boilerplate-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
